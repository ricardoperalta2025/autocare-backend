spring.application.name=autocare-backend
spring.mongodb.uri=${MONGODB_URI}
server.port=8080

# La documentación se publica únicamente con catalogo-local.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
# Springdoc publica sus propios recursos cuando la interfaz está habilitada.
spring.web.resources.add-mappings=false
